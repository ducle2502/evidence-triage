<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="banner-title banner-desc">
  <title id="banner-title">evidence-triage — structured evidence triage for internal audit</title>
  <desc id="banner-desc">Typographic banner with the wordmark evidence-triage above a three-phase strip: hunting, triage, investigation.</desc>

  <rect width="1280" height="420" fill="#F8FAFC"/>

  <line x1="96" y1="50" x2="1184" y2="50" stroke="#CBD5E1" stroke-width="1"/>
  <rect x="96" y="46" width="8" height="8" fill="#15803D"/>

  <text x="96" y="90" font-family="JetBrains Mono, IBM Plex Mono, Consolas, monospace" font-size="16" letter-spacing="4" fill="#15803D">INTERNAL AUDIT / EVIDENCE WORKFLOW</text>
  <text x="1184" y="90" text-anchor="end" font-family="JetBrains Mono, IBM Plex Mono, Consolas, monospace" font-size="12" letter-spacing="2" fill="#64748B">v3.0.0  ·  PUBLIC  ·  SYNTHETIC DATA</text>

  <text x="96" y="208" font-family="JetBrains Mono, IBM Plex Mono, Consolas, monospace" font-size="96" font-weight="700" letter-spacing="-2" fill="#0F172A">evidence-triage</text>

  <rect x="96" y="236" width="96" height="4" fill="#15803D"/>

  <text x="96" y="292" font-family="IBM Plex Sans, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="30" fill="#334155">Surface anomalies. Rank what matters.</text>
  <text x="96" y="330" font-family="IBM Plex Sans, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="30" fill="#334155">Prove what happened.</text>

  <line x1="96" y1="374" x2="1184" y2="374" stroke="#CBD5E1" stroke-width="1.5"/>

  <g>
    <circle cx="96" cy="374" r="4" fill="#15803D"/>
    <text x="96" y="406" font-family="JetBrains Mono, IBM Plex Mono, Consolas, monospace" font-size="13" letter-spacing="2" fill="#15803D">01</text>
    <text x="128" y="406" font-family="JetBrains Mono, IBM Plex Mono, Consolas, monospace" font-size="18" font-weight="700" letter-spacing="2" fill="#0F172A">HUNTING</text>
  </g>

  <g>
    <circle cx="459" cy="374" r="4" fill="#15803D"/>
    <text x="459" y="406" font-family="JetBrains Mono, IBM Plex Mono, Consolas, monospace" font-size="13" letter-spacing="2" fill="#15803D">02</text>
    <text x="491" y="406" font-family="JetBrains Mono, IBM Plex Mono, Consolas, monospace" font-size="18" font-weight="700" letter-spacing="2" fill="#0F172A">TRIAGE</text>
  </g>

  <g>
    <circle cx="822" cy="374" r="4" fill="#15803D"/>
    <text x="822" y="406" font-family="JetBrains Mono, IBM Plex Mono, Consolas, monospace" font-size="13" letter-spacing="2" fill="#15803D">03</text>
    <text x="854" y="406" font-family="JetBrains Mono, IBM Plex Mono, Consolas, monospace" font-size="18" font-weight="700" letter-spacing="2" fill="#0F172A">INVESTIGATION</text>
  </g>
</svg>
