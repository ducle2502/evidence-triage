<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="banner-title banner-desc">
  <title id="banner-title">evidence-triage — structured evidence triage for internal audit</title>
  <desc id="banner-desc">Typographic banner with the wordmark evidence-triage above a three-phase strip: hunting, triage, investigation.</desc>

  <rect width="1280" height="640" fill="#0F172A"/>

  <line x1="96" y1="110" x2="1184" y2="110" stroke="#334155" stroke-width="1"/>
