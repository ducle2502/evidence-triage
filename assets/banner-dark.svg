  <text x="1184" y="164" text-anchor="end" font-family="JetBrains Mono, IBM Plex Mono, Consolas, monospace" font-size="12" letter-spacing="2" fill="#94A3B8">v3.0.0  ·  PUBLIC  ·  SYNTHETIC DATA</text>

  <text x="96" y="302" font-family="JetBrains Mono, IBM Plex Mono, Consolas, monospace" font-size="96" font-weight="700" letter-spacing="-2" fill="#F8FAFC">evidence-triage</text>

