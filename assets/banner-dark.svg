  <text x="96" y="460" font-family="IBM Plex Sans, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="34" fill="#CBD5E1">Prove what happened.</text>

  <line x1="96" y1="536" x2="1184" y2="536" stroke="#334155" stroke-width="1.5"/>

  <g>
    <circle cx="96" cy="536" r="4" fill="#22C55E"/>
