    <text x="96" y="596" font-family="JetBrains Mono, IBM Plex Mono, Consolas, monospace" font-size="18" font-weight="700" letter-spacing="2" fill="#F8FAFC">HUNTING</text>
    <text x="96" y="622" font-family="IBM Plex Sans, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#94A3B8">risk sensing</text>
